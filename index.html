
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Calculator</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">

    <header class="topbar">
      <div>
        <h1>Calculator</h1>
        <p>Advanced Calculator</p>
      </div>
      <button id="themeBtn" class="icon-btn">🌙</button>
    </header>

    <section class="calculator">
      <div class="display">
        <div id="expression" class="expression"></div>
        <input id="screen" class="screen" value="0" readonly>
        <div id="message" class="message">Ready to calculate</div>
      </div>

      <div class="scientific-keys">
        <button class="key function" data-value="sqrt(">√</button>
        <button class="key function" data-value="^">xʸ</button>
        <button class="key function" data-value="sin(">sin</button>
        <button class="key function" data-value="cos(">cos</button>
        <button class="key function" data-value="tan(">tan</button>

        <button class="key function" data-value="log(">log</button>
        <button class="key function" data-value="ln(">ln</button>
        <button class="key function" data-value="pi">π</button>
        <button class="key function" data-value="(">(</button>
        <button class="key function" data-value=")">)</button>
      </div>

      <div class="keypad">
        <button class="key danger" data-action="clear">AC</button>
        <button class="key function" data-action="backspace">⌫</button>
        <button class="key function" data-value="%">%</button>
        <button class="key function" data-value="/">÷</button>

        <button class="key" data-value="7">7</button>
        <button class="key" data-value="8">8</button>
        <button class="key" data-value="9">9</button>
        <button class="key function" data-value="*">×</button>

        <button class="key" data-value="4">4</button>
        <button class="key" data-value="5">5</button>
        <button class="key" data-value="6">6</button>
        <button class="key function" data-value="-">−</button>

        <button class="key" data-value="1">1</button>
        <button class="key" data-value="2">2</button>
        <button class="key" data-value="3">3</button>
        <button class="key function" data-value="+">+</button>

        <button class="key function" data-action="sign">±</button>
        <button class="key" data-value="0">0</button>
        <button class="key" data-value=".">.</button>
        <button class="key equals" data-action="calculate">=</button>
      </div>
    </section>

    <section class="history-panel">
      <div class="history-heading">
        <h2>Calculation History</h2>
        <button id="clearHistory" class="text-btn">Clear</button>
      </div>
      <div id="historyList" class="history-list">
        <p class="empty">Your calculations will appear here.</p>
      </div>
    </section>

    <footer>Built with HTML, CSS &amp; JavaScript</footer>

  </main>
</body>
</html>
